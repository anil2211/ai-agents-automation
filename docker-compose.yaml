version: "3.9"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      # --- Basic Auth ---
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123

      # --- Core ---
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"

      # --- Binary Data (CRITICAL) ---
      N8N_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/binaryData
      N8N_DEFAULT_BINARY_DATA_FORMAT: buffer
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"

      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n

      # --- Features ---
      N8N_AUTO_INSTALL_NODES: "true"
      N8N_RUNNERS_ENABLED: "false"

    volumes:
      # n8n config, DB cache, credentials, binaryData
      - n8n_data:/home/node/.n8n

      # All workflow output files
      - ./generated_files:/data

    depends_on:
      - postgres


  postgres:
    image: postgres:14
    container_name: n8n_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  postgres_data:
